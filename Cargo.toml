[package]
name = "river-bsp-layout"
version = "2.2.0"
edition = "2021"
authors = ["AJ Reifsnyder <aj@ajreifsnyder.com>"]
license = "GPL-3.0"
description = "Binary space partitioned layout for the tiling Wayland compositor River."
repository = "https://github.com/areif-dev/river-bsp-layout"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
river-layout-toolkit = "0.1"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/river-bsp-layout", dest = "/usr/bin/river-bsp-layout", mode = "755" },
]
